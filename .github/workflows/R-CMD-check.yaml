# Comprobacion del paquete en Linux, macOS y Windows con las versiones actual y anterior de R,
# con R-devel y solo con las dependencias duras (Imports/Depends), sin ningun paquete de Suggests.
#
# Version minima de R. DESCRIPTION declara R >= 4.1.0 para el nucleo (importacion, descripcion
# bibliometrica, preparacion del corpus, exportacion y verificacion). Ese nucleo se comprueba con
# R 4.1.0 instalando unicamente las dependencias duras: algunos paquetes opcionales de Suggests
# exigen una version de R posterior (dbscan, necesario para HDBSCAN, requiere R >= 4.3.0) y
# resolverlos junto con el resto impedia que el trabajo llegara a ejecutar el check. Las
# capacidades opcionales se comprueban en las versiones release, oldrel-1 y devel, con todas
# las dependencias.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}${{ matrix.config.hard_only && ', dependencias duras' || '' }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-22.04,   r: '4.1.0', hard_only: true}
          - {os: ubuntu-latest,  r: 'release', hard_only: true}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Con hard_only, R CMD check solo ve las dependencias declaradas como obligatorias: los
      # ejemplos, las pruebas y la vineta deben condicionar cada paquete de Suggests.
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.hard_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # testthat se instala siempre: tests/testthat.R lo carga y, con dependencias duras, setup-r-dependencies
          # no instala los paquetes de Suggests; las pruebas condicionan el resto de paquetes opcionales.
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
          dependencies: ${{ matrix.config.hard_only && '"hard"' || '"all"' }}
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

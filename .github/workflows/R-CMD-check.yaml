# Comprobacion del paquete en Linux, macOS y Windows con las versiones actual y anterior de R,
# con R-devel, con la version minima declarada en DESCRIPTION (R 4.1.0) y solo con las
# dependencias duras (Imports/Depends), sin ningun paquete de Suggests.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}${{ matrix.config.hard_only && ', dependencias duras' || '' }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-22.04,   r: '4.1.0'}
          - {os: ubuntu-latest,  r: 'release', hard_only: true}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Con hard_only, R CMD check solo ve las dependencias declaradas como obligatorias: los
      # ejemplos, las pruebas y la vineta deben condicionar cada paquete de Suggests.
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.hard_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          dependencies: ${{ matrix.config.hard_only && '"hard"' || '"all"' }}
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

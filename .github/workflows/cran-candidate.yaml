name: CRAN candidate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BIBLIOLAB_DIST: /tmp/bibliolab-cran-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install manual font
        run: |
          tlmgr update --self
          tlmgr install inconsolata
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          dependencies: '"all"'
      - name: Build source package with current R
        shell: Rscript {0}
        run: |
          dest <- Sys.getenv("BIBLIOLAB_DIST")
          dir.create(dest)
          writeLines(c(capture.output(sessionInfo()),
                       paste("Commit:", Sys.getenv("GITHUB_SHA"))), file.path(dest, "build-environment.txt"))
          status <- system2(file.path(R.home("bin"), "R"),
                            c("CMD", "build", "--compact-vignettes=gs+qpdf", "."))
          stopifnot(status == 0L)
          version <- read.dcf("DESCRIPTION", fields = "Version")[[1L]]
          tarball <- paste0("bibliolab_", version, ".tar.gz")
          stopifnot(file.rename(tarball, file.path(dest, tarball)))
      - name: Check the exact source tarball
        shell: Rscript {0}
        run: |
          tarball <- list.files(Sys.getenv("BIBLIOLAB_DIST"), pattern = "[.]tar[.]gz$", full.names = TRUE)
          stopifnot(length(tarball) == 1L)
          rcmdcheck::rcmdcheck(tarball, args = c("--as-cran", "--run-donttest"),
                              error_on = "warning", check_dir = "check")
      - name: Fingerprint checked package
        run: |
          cd "$BIBLIOLAB_DIST"
          sha256sum bibliolab_*.tar.gz > SHA256SUMS
      - name: Save checked source package
        uses: actions/upload-artifact@v4
        with:
          name: cran-candidate-${{ github.sha }}
          path: ${{ env.BIBLIOLAB_DIST }}/
          if-no-files-found: error
          retention-days: 30
      - name: Save check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cran-check-${{ github.sha }}
          path: check/
          if-no-files-found: ignore
          retention-days: 30
